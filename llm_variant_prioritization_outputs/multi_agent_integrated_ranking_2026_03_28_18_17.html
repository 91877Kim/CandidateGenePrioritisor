g programs required to implement asymmetry and MCM specification."}]}, {"gene": "sys-1", "average_rank": 1.9, "rank_variance": 0.89, "n_runs_seen": 10, "impact_bucket": "MODERATE", "WB_Overview": "Enables RNA polymerase II-specific DNA-binding transcription factor binding activity; scaffold protein binding activity; and transcription coactivator activity. Involved in several processes, including cell fate commitment involved in formation of primary germ layer; gonad development; and regulation of gene expression. Located in several cellular components, including cell cortex; kinetochore; and pericentriolar material. Expressed in several structures, including ABplpapaap; ABprpapaap; Z1.aa; posterior distal tip cell; and tail hypodermis.", "MANUAL_DESCRIPTION_WB": "sys-1 encodes a novel protein that contains three divergent armadillo repeats; during gonadogenesis, SYS-1 functions in a Wnt/MAPK signaling pathway as a dosage-dependent beta-catenin-like transcriptional coactivator required for specification of distal cell fates; consistent with its role as a beta-catenin, SYS-1 interacts, in yeast two-hybrid and coimmunoprecipitation assays, with the POP-1/TCF transcription factor with which it can  stimulate transcription via TCF binding sites; in two hybrid-assays, the POP-1/SYS-1 interaction requires the N-terminal beta-catenin binding domain of POP-1, and most of the SYS-1 protein; a VNS::SYS-1 reporter fusion protein is expressed in several tissues during embryonic and larval development and localizes to both the nucleus and cytoplasm as well as to what appears to be the centrosomes; in many tissues, SYS-1 is distributed asymmetrically, in a manner reciprocal to the asymmetric distribution of POP-1.", "effect": "missense_variant", "user_annotation": "WNT (Rook)", "pubmed_ref_avaiable": "PMID 37503055: SYS-1/beta-catenin inheritance and regulation by Wnt-signaling during asymmetric cell division. (https://pubmed.ncbi.nlm.nih.gov/37503055/) ; PMID 23799580: The Caenor     function formatNumber(x) {
      if (x === null || x === undefined || isNaN(x)) return '';
      return x.toFixed(3);
    }

    function renderTable() {
      const tbody = document.querySelector('#genes-table tbody');
      tbody.innerHTML = '';
      // DATA.genes is already sorted by average_rank ascending in the Python script.
      const genes = DATA.genes || [];
      for (const g of genes) {
        const tr = document.createElement('tr');
        tr.dataset.gene = g.gene;
        tr.innerHTML = `
          <td>${g.gene}</td>
          <td>${formatNumber(g.average_rank)}</td>
          <td>${formatNumber(g.rank_variance)}</td>
          <td>${g.n_runs_seen}</td>
        `;
        tr.addEventListener('click', () => renderDetail(g));
        tbody.appendChild(tr);
      }
    }

    function renderDetail(geneEntry) {
      const title = document.getElementById('detail-title');
      const meta = document.getElementById('detail-meta');
      const table = document.getElementById('detail-table');
      const tbody = table.querySelector('tbody');
      title.textContent = `Details for gene: ${geneEntry.gene}`;
      const metaLines = [];
      if (geneEntry.effect) metaLines.push(`<strong>Effect</strong>: ${geneEntry.effect}`);
      if (geneEntry.impact_bucket) metaLines.push(`<strong>impact_bucket</strong>: ${geneEntry.impact_bucket}`);
      if (geneEntry.user_annotation) metaLines.push(`<strong>user_annotation</strong>: ${geneEntry.user_annotation}`);
      if (geneEntry.WB_Overview) metaLines.push(`<strong>WB_Overview</strong>: ${geneEntry.WB_Overview}`);
      if (geneEntry.MANUAL_DESCRIPTION_WB) metaLines.push(`<strong>MANUAL_DESCRIPTION_WB</strong>: ${geneEntry.MANUAL_DESCRIPTION_WB}`);
      if (geneEntry.pubmed_ref_avaiable) metaLines.push(`<strong>pubmed_ref_avaiable</strong>: ${geneEntry.pubmed_ref_avaiable}`);
      if (geneEntry.filtered_pubmed) metaLines.push(`<strong>filtered_pubmed</strong>: ${geneEntry.filtered_pubmed}`);
      if (geneEntry.agent1_publication_comments) metaLines.push(`<strong>agent1_publication_comments</strong>: ${geneEntry.agent1_publication_comments}`);
      meta.innerHTML = metaLines.length ? metaLines.join('<br/>') : '';
      tbody.innerHTML = '';
      let hasRows = false;
      for (const r of geneEntry.runs) {
        const hasText = (r.Narrative && r.Narrative.trim()) || (r.Rationale && r.Rationale.trim());
        if (!hasText) continue;
        hasRows = true;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.run_index}${r.rank ? ` (rank ${r.rank})` : ''}</td>
          <td>${r.Narrative || ''}</td>
          <td>${r.Rationale || ''}</td>
        `;
        tbody.appendChild(tr);
      }
      table.style.display = hasRows ? 'table' : 'none';
      if (!hasRows) {
        title.textContent += ' (no narratives/rationales recorded in the top list)';
      }
    }

    renderTable();
  </script>
