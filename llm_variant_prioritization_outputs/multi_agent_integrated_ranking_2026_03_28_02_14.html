  <script>
    const DATA = {"timestamp": "2026_03_28_02_14", "num_runs": 1, "genes": [{"gene": "ceh-36", "average_rank": 1.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODIFIER", "WB_Overview": "Enables RNA polymerase II transcription regulatory region sequence-specific DNA binding activity. Involved in neuron fate specification; positive regulation of transcription by RNA polymerase II; and sensory perception of chemical stimulus. Located in nucleus. Expressed in ABaraappa; ABaraappaa; amphid neurons; and head neurons. Is an ortholog of human ARGFX (arginine-fifty homeobox) and DPRX (divergent-paired related homeobox).", "MANUAL_DESCRIPTION_WB": "ceh-36 encodes a paired-like homeodomain transcription factor that is one of three orthodenticle (OTX/OTD) homeodomain proteins in C. elegans (the others being TTX-1 and CEH-37); CEH-36 is required broadly for specification of the AWC olfactory neuron and also for establishing the left-right asymmetry of the ASEL and ASER gustatory neurons; in addition, CEH-36 is sufficient to specify the AFD thermosensory neuron fate in some cell types; CEH-36 is expressed in the AWC and ASE chemosensory neurons.", "effect": "upstream_gene_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 25738873: The Bicoid class homeodomain factors ceh-36/OTX and unc-30/PITX cooperate in C. elegans embryonic progenitor cells to regulate robust development. (https://pubmed.ncbi.nlm.nih.gov/25738873/) ; PMID 26998749: C. elegans Demonstrates Distinct Behaviors within a Fixed and Uniform Electric Field. (https://pubmed.ncbi.nlm.nih.gov/26998749/) ; PMID 34849889: Synergistic roles of homeodomain proteins UNC-62 homothorax and MLS-2 HMX/NKX in the specification of olfactory neurons in Caenorhabditis elegans. (https://pubmed.ncbi.nlm.nih.gov/34849889/)", "filtered_pubmed": "25738873", "agent1_publication_comments": "PMID25738873: Relevant - score:7 Reason:The study shows ceh-36 is expressed in many embryonic progenitors and ceh-36 mutants display cell cycle (and migration) defects in over 100 cells, supporting a role in regulating progenitor cell divisions that could underlie asymmetric division failure. However, the paper does not directly demonstrate effects in the male AMso lineage or MCM neuron generation. ; PMID26998749: Irrelevant - score:2 Reason:The paper links ceh-36 to terminal differentiation of amphid sensory neurons (AWC and ASE) and electrotaxis behavior but provides no data on AMso lineage, asymmetric cell division, or MCM neuron generation. Thus it does not offer a mechanistic explanation for AMso division failure leading to loss of male MCM neurons. ; PMID34849889: Irrelevant - score:2 Reason:The paper documents that CEH-36 (OTX) and MLS-2/UNC-62 regulate specification and asymmetric differentiation of the AWC olfactory neuron pair (MLS-2 regulates ceh-36 and unc-62; unc-62 and mls-2 act cell-autonomously and sequentially). It does not provide any evidence linking these factors or the described asymmetric differentiation mechanism to AMso asymmetric cell division or division failure that would cause loss of MCM neurons.", "runs": [{"run_index": 1, "rank": 1, "Narrative": "An upstream variant in ceh-36 maps perfectly (Parental_ratio=1.0) and occurs on an EMS background, and CEH-36 loss has been shown to cause progenitor cell cycle defects making it a strong mechanistic candidate to block AMso division and MCM production [Effect=upstream_gene_variant; impact_bucket=MODIFIER; QUAL=43.8; DP=10.0; distilled_mechanism=\"Loss of ceh-36 causes cell cycle defects in numerous embryonic progenitor cells, indicating it regulates progenitor cell divisions.\"; MANUAL_DESCRIPTION_WB=\"ceh-36 encodes a paired-like homeodomain transcription factor...\"; Parental_ratio=1.0; EMS_label=True].", "Rationale": "CEH-36 has a documented role regulating progenitor cell divisions and the variant maps perfectly (Parental_ratio=1.0) in an EMS background, making it the most plausible cause of AMso division failure and MCM loss."}]}, {"gene": "cdk-4", "average_rank": 2.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODERATE", "WB_Overview": "Enables protein serine/threonine kinase activity. Involved in several processes, including G1/S transition of mitotic cell cycle; developmental process involved in reproduction; and positive regulation of cell cycle process. Part of cyclin D1-CDK4 complex. Expressed in gonad; intestine; neurons; and vulva. Used to study cancer. Human ortholog(s) of this gene implicated in several diseases, including carcinoma (multiple); central nervous system cancer (multiple); and urinary system cancer (multiple). Is an ortholog of human CDK4 (cyclin dependent kinase 4) and CDK6 (cyclin dependent kinase 6).", "MANUAL_DESCRIPTION_WB": "cdk-4 encodes two isoforms of a cyclin-dependent serine/threonine protein kinase orthologous to human CDK4 and CDK6 (OMIM:123829 and OMIM:603368, mutated in cutanous malignant melanoma) which complex with D-type cyclins to regulate progression through the G1 phase of the cell cycle; CDK-4 activity is essential for G1 progression in postembryonic blast cells and as a result, cdk-4 mutant animals generally arrest during larval stages; the lethality generated by cdk mutations, also seen in animals doubly mutant for cdk-4 and cyd-1, a C. elegans D-type cyclin, can be suppressed by mutations in lin-35/Rb suggesting that, as in other organisms, LIN-35/Rb may be a major target of CDK-4/CYD-1 kinase activity; CDK-4 expression is first detected in neuronal and hypodermal lineages during mid-to-late embryogenesis, with postembryonic expression detected in hypodermal seam cells, cells of the P lineage which will give rise to ventral cord neurons, and cells of the somatic gonad, the vulva, and the intestine.", "effect": "missense_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 40383750: CDK-4 regulates nucleolar size and metabolism at the cost of late-life fitness in C. elegans. (https://pubmed.ncbi.nlm.nih.gov/40383750/) ; PMID 22102824: Caenorhabditis elegans cyclin D/CDK4 and cyclin E/CDK2 induce distinct cell cycle re-entry programs in differentiated muscle cells. (https://pubmed.ncbi.nlm.nih.gov/22102824/) ; PMID 25562820: Rb and FZR1/Cdh1 determine CDK4/6-cyclin D requirement in C. elegans and human cancer cells. (https://pubmed.ncbi.nlm.nih.gov/25562820/)", "filtered_pubmed": "22102824; 25562820", "agent1_publication_comments": "PMID40383750: Irrelevant - score:2 Reason:The summary describes CDK-4 impacting nucleolar size, metabolism, and aging phenotypes via LIN-35 (Rb) and EFL-1 (E2F) in C. elegans, with no data on asymmetric cell division, AMso lineage behavior, or MCM neuron specification. Thus it does not provide a mechanistic explanation for AMso division failure leading to loss of MCM neurons. ; PMID22102824: Relevant - score:8 Reason:The paper demonstrates that CYD-1/CDK-4 directly drives G1/S entry and is sufficient to induce DNA synthesis by activating a broad set of cell-cycle genes, providing a clear molecular capability to enable or block a precursor cell's division. However, the experiments are in differentiated muscle cells rather than the AMso lineage or asymmetric division contexts, so the link to AMso asymmetric division failure is plausible but not directly shown. ; PMID25562820: Relevant - score:8 Reason:The study demonstrates that CDK-4/CYD-1 is required for cell cycle entry through phosphorylation of LIN-35 (Rb) and FZR-1 (Cdh1), which provides a direct mechanistic route by which CDK-4 dysfunction could cause a cell division failure leading to loss of lineage-derived cells such as MCM. The paper, however, does not examine asymmetric division or the AMso/MCM lineage specifically, so applicability to asymmetric division failure is plausible but not directly shown.", "runs": [{"run_index": 1, "rank": 2, "Narrative": "A missense variant in cdk-4 could impair CDK-4 kinase activity necessary for G1 progression in postembryonic blast cells, plausibly preventing the AMso from entering S phase and dividing to form MCM neurons [Effect=missense_variant; impact_bucket=MODERATE; QUAL=43.9; DP=10.0; distilled_mechanism=\"CYD-1/CDK-4 expression... CDK-4/CYD-1 phosphorylates specific residues in LIN-35 and FZR-1 to promote cell cycle entry\"; MANUAL_DESCRIPTION_WB=\"cdk-4 encodes two isoforms... essential for G1 progression in postembryonic blast cells.\"; Parental_ratio=NaN; EMS_label=True].", "Rationale": "CDK-4 is a core G1/S cell-cycle regulator required for postembryonic blast cell divisions, so a missense in cdk-4 could block AMso entry into mitosis and prevent MCM generation."}]}, {"gene": "col-183", "average_rank": 3.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODERATE", "WB_Overview": "Predicted to be a structural constituent of cuticle. Predicted to be located in membrane. Predicted to be part of collagen trimer. Expressed in hypodermis.", "MANUAL_DESCRIPTION_WB": "", "effect": "missense_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 34265532: Integrating transcriptomics and behavior tests reveals how the C. elegans responds to copper induced aging. (https://pubmed.ncbi.nlm.nih.gov/34265532/) ; PMID 31242447: Genetic markers enable the verification and manipulation of the dauer entry decision. (https://pubmed.ncbi.nlm.nih.gov/31242447/)", "filtered_pubmed": "", "agent1_publication_comments": "PMID34265532: Irrelevant - score:2 Reason:The paper reports copper-induced aging phenotypes and differential expression of genes including col-183 and other cuticle collagens, but presents no data on cell division, asymmetric division machinery, AMso lineage, or MCM neuron specification. Therefore it lacks a mechanistic link to AMso asymmetric division failure causing loss of MCM neurons. ; PMID31242447: Irrelevant - score:1 Reason:The paper describes dauer-entry markers (including col-183) and their use in hypodermal fate decisions and tissue coordination during dauer, but contains no data on AMso lineages, asymmetric cell division mechanisms, or MCM neuron development. Therefore it provides no mechanistic explanation for AMso division failure leading to loss of MCM neurons.", "runs": [{"run_index": 1, "rank": 3, "Narrative": "This moderate-impact missense in col-183, a predicted cuticle collagen expressed in hypodermis, maps strongly (Parental_ratio=0.917) but has no clear role in glial cell-cycle control, so it's an unlikely direct cause of AMso division failure though pleiotropic effects cannot be excluded [Effect=missense_variant; impact_bucket=MODERATE; QUAL=41.5; DP=8.0; WB_Overview=\"Predicted to be a structural constituent of cuticle... expressed in hypodermis.\"; Parental_ratio=0.917; EMS_label=True].", "Rationale": "A moderate-impact missense in col-183 maps strongly (Parental_ratio=0.917) but the gene is a cuticle collagen expressed in hypodermis, making a direct role in AMso division less likely."}]}, {"gene": "F23D12.2", "average_rank": 4.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODIFIER", "WB_Overview": "Enriched in germ line and head mesodermal cell based on RNA-seq studies. Is affected by several genes including cyc-1; swsn-1; and dve-1 based on microarray and RNA-seq studies. Is affected by nineteen chemicals including D-glucose; Alovudine; and stavudine based on RNA-seq and microarray studies.", "MANUAL_DESCRIPTION_WB": "This gene encodes a protein containing an F-box, a motif predicted to mediate protein-protein interactions either with homologs of yeast Skp-1p or with other proteins; this gene's encoded protein also contains an FTH/DUF38 motif, which may also mediate protein-protein interaction.", "effect": "upstream_gene_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "", "filtered_pubmed": "", "agent1_publication_comments": "", "runs": [{"run_index": 1, "rank": 4, "Narrative": "An upstream variant in F23D12.2 could affect expression of this F-box-containing protein that might regulate turnover of factors controlling cell division; mapping (Parental_ratio=0.889) and EMS origin lend some weight but no direct functional link is known [Effect=upstream_gene_variant; impact_bucket=MODIFIER; QUAL=47.3; DP=15.0; MANUAL_DESCRIPTION_WB=\"encodes a protein containing an F-box...\"; Parental_ratio=0.889; EMS_label=True].", "Rationale": "Variant is upstream (MODIFIER) but the gene encodes an F-box protein that could affect protein turnover of cell-cycle regulators, and it shows good mapping (Parental_ratio=0.889) in an EMS background."}]}, {"gene": "cyp-13B1", "average_rank": 5.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "HIGH", "WB_Overview": "Predicted to enable heme binding activity; iron ion binding activity; and oxidoreductase activity. Human ortholog(s) of this gene implicated in several diseases, including Ghosal hematodiaphyseal syndrome; familial Mediterranean fever; and leukemia (multiple). Is an ortholog of several human genes including CYP3A4 (cytochrome P450 family 3 subfamily A member 4); CYP3A5 (cytochrome P450 family 3 subfamily A member 5); and CYP3A7 (cytochrome P450 family 3 subfamily A member 7).", "MANUAL_DESCRIPTION_WB": "cyp-13B1 encodes one of ~80 C. elegans cytochrome P450s: membrane-associated, heme-containing NADPH-dependent monooxygenases that catalyze the oxidative metabolism of a variety of exogenous compounds and endogenous substrates.", "effect": "stop_gained", "user_annotation": "no annotation", "pubmed_ref_avaiable": "", "filtered_pubmed": "", "agent1_publication_comments": "", "runs": [{"run_index": 1, "rank": 5, "Narrative": "A stop_gained (HIGH) variant likely creates a null allele of cyp-13B1, but as a cytochrome P450 with metabolic roles there is no direct evidence it controls AMso division, making it a lower-priority candidate despite strong predicted loss-of-function [Effect=stop_gained; impact_bucket=HIGH; QUAL=50.4; DP=16.0; MANUAL_DESCRIPTION_WB=\"cyp-13B1 encodes one of ~80 cytochrome P450s...\"; Parental_ratio=NaN; EMS_label=True].", "Rationale": "A HIGH-impact stop_gained variant likely generates a null allele, but CYP-13B1 is a cytochrome P450 with metabolic roles and no direct evidence for regulating cell division, lowering its plausibility despite the null effect."}]}, {"gene": "vwa-8", "average_rank": 6.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODIFIER", "WB_Overview": "Predicted to enable ATP binding activity and ATP hydrolysis activity. Predicted to be located in cytoplasm. Expressed in hypodermal cell; intestinal cell; and muscle cell. Is an ortholog of human VWA8 (von Willebrand factor A domain containing 8).", "MANUAL_DESCRIPTION_WB": "", "effect": "downstream_gene_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 32656508: C. elegans VWA-8 is a mitochondrial protein. (https://pubmed.ncbi.nlm.nih.gov/32656508/) ; PMID 32656509: A null mutation of C. elegans vwa-8. (https://pubmed.ncbi.nlm.nih.gov/32656509/)", "filtered_pubmed": "", "agent1_publication_comments": "PMID32656508: Irrelevant - score:2 Reason:The summary only states VWA-8 is a mitochondrial protein and gives no evidence linking it to asymmetric cell division, AMso lineage specification, or MCM neurogenesis. Mitochondrial localization is a broad cellular property and, without functional data connecting VWA-8 to division machinery or asymmetric fate determinants, it does not mechanistically explain AMso division failure. ; PMID32656509: Irrelevant - score:1 Reason:The provided literature text contains only a title with no abstract or experimental details linking vwa-8 to asymmetric cell division, the AMso lineage, or MCM neuron development, so there is no mechanistic evidence connecting vwa-8 loss to AMso division failure. In the absence of data on cellular behavior, polarity, division machinery, or lineage outcomes, mechanistic relevance cannot be established.", "runs": [{"run_index": 1, "rank": 6, "Narrative": "The downstream variant near vwa-8 (Parental_ratio=1.0) could affect regulatory elements, but VWA-8 is an ATPase-like protein with broad expression and no specific link to postembryonic glial division, so causality is uncertain [Effect=downstream_gene_variant; impact_bucket=MODIFIER; QUAL=30.3; DP=14.0; WB_Overview=\"Predicted to enable ATP binding and ATP hydrolysis activity...\"; Parental_ratio=1.0; EMS_label=True].", "Rationale": "Variant is downstream (MODIFIER) but maps perfectly (Parental_ratio=1.0); VWA-8 is an ATPase-like protein with broad expression and no direct link to cell-cycle control, so it's a lower-confidence candidate."}]}, {"gene": "C04C11.16", "average_rank": 7.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODIFIER", "WB_Overview": "", "MANUAL_DESCRIPTION_WB": "", "effect": "upstream_gene_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "", "filtered_pubmed": "", "agent1_publication_comments": "", "runs": [{"run_index": 1, "rank": 7, "Narrative": "An upstream (MODIFIER) variant with perfect mapping (Parental_ratio=1.0) in an EMS background makes C04C11.16 worth considering, but lack of annotation means there's no direct mechanistic link to AMso division at present [Effect=upstream_gene_variant; impact_bucket=MODIFIER; QUAL=47.7; DP=12.0; No WB_Overview/MANUAL_DESCRIPTION available; Parental_ratio=1.0; EMS_label=True].", "Rationale": "An upstream (MODIFIER) variant with perfect mapping (Parental_ratio=1.0) in an EMS background makes this unknown gene a moderate candidate despite lack of functional annotation."}]}, {"gene": "21ur-13251", "average_rank": 8.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODIFIER", "WB_Overview": "", "MANUAL_DESCRIPTION_WB": "", "effect": "downstream_gene_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "", "filtered_pubmed": "", "agent1_publication_comments": "", "runs": [{"run_index": 1, "rank": 8, "Narrative": "A downstream variant near a  "unc-9", "average_rank": 10.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODIFIER", "WB_Overview": "Enables actin filament binding activity and gap junction channel activity. Involved in monoatomic ion transmembrane transport and positive regulation of locomotion. Located in gap junction. Expressed in several structures, including anchor cell; muscle cell; neurons; phasmid sheath cell; and somatic nervous system. Human ortholog(s) of this gene implicated in depressive disorder. Is an ortholog of human PANX1 (pannexin 1).", "MANUAL_DESCRIPTION_WB": "unc-9 encodes an innexin, an integral transmembrane channel protein that is a structural component of invertebrate gap junctions; UNC-9 is required for normal forward locomotion and egg-laying and also plays a role in the response to antihelminthics and volatile anesthetics; UNC-9 may form a functional pair with UNC-7, another C. elegans innexin, as mutations in unc-7 result in defects nearly identical to those in unc-9 mutant animals.", "effect": "upstream_gene_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 19386917: Caenorhabditis elegans innexins regulate active zone differentiation. (https://pubmed.ncbi.nlm.nih.gov/19386917/) ; PMID 30323068: Gap Junctions and NCA Cation Channels Are Critical for Developmentally Timed Sleep and Arousal in Caenorhabditis elegans. (https://pubmed.ncbi.nlm.nih.gov/30323068/) ; PMID 17658257: UNC-1 regulates gap junctions important to locomotion in C. elegans. (https://pubmed.ncbi.nlm.nih.gov/17658257/)", "filtered_pubmed": "", "agent1_publication_comments": "PMID19386917: Irrelevant - score:1 Reason:The study describes UNC-7 and UNC-9 innexins regulating active zone differentiation and presynaptic/perisynaptic localization at neuromuscular junctions, but it provides no evidence connecting these proteins to asymmetric cell division, AMso division failure, or MCM neuron specification. ; PMID30323068: Irrelevant - score:2 Reason:The paper describ     function formatNumber(x) {
      if (x === null || x === undefined || isNaN(x)) return '';
      return x.toFixed(3);
    }

    function renderTable() {
      const tbody = document.querySelector('#genes-table tbody');
      tbody.innerHTML = '';
      // DATA.genes is already sorted by average_rank ascending in the Python script.
      const genes = DATA.genes || [];
      for (const g of genes) {
        const tr = document.createElement('tr');
        tr.dataset.gene = g.gene;
        tr.innerHTML = `
          <td>${g.gene}</td>
          <td>${formatNumber(g.average_rank)}</td>
          <td>${formatNumber(g.rank_variance)}</td>
          <td>${g.n_runs_seen}</td>
        `;
        tr.addEventListener('click', () => renderDetail(g));
        tbody.appendChild(tr);
      }
    }

    function renderDetail(geneEntry) {
      const title = document.getElementById('detail-title');
      const meta = document.getElementById('detail-meta');
      const table = document.getElementById('detail-table');
      const tbody = table.querySelector('tbody');
      title.textContent = `Details for gene: ${geneEntry.gene}`;
      const metaLines = [];
      if (geneEntry.effect) metaLines.push(`<strong>Effect</strong>: ${geneEntry.effect}`);
      if (geneEntry.impact_bucket) metaLines.push(`<strong>impact_bucket</strong>: ${geneEntry.impact_bucket}`);
      if (geneEntry.user_annotation) metaLines.push(`<strong>user_annotation</strong>: ${geneEntry.user_annotation}`);
      if (geneEntry.WB_Overview) metaLines.push(`<strong>WB_Overview</strong>: ${geneEntry.WB_Overview}`);
      if (geneEntry.MANUAL_DESCRIPTION_WB) metaLines.push(`<strong>MANUAL_DESCRIPTION_WB</strong>: ${geneEntry.MANUAL_DESCRIPTION_WB}`);
      if (geneEntry.pubmed_ref_avaiable) metaLines.push(`<strong>pubmed_ref_avaiable</strong>: ${geneEntry.pubmed_ref_avaiable}`);
      if (geneEntry.filtered_pubmed) metaLines.push(`<strong>filtered_pubmed</strong>: ${geneEntry.filtered_pubmed}`);
      if (geneEntry.agent1_publication_comments) metaLines.push(`<strong>agent1_publication_comments</strong>: ${geneEntry.agent1_publication_comments}`);
      meta.innerHTML = metaLines.length ? metaLines.join('<br/>') : '';
      tbody.innerHTML = '';
      let hasRows = false;
      for (const r of geneEntry.runs) {
        const hasText = (r.Narrative && r.Narrative.trim()) || (r.Rationale && r.Rationale.trim());
        if (!hasText) continue;
        hasRows = true;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.run_index}${r.rank ? ` (rank ${r.rank})` : ''}</td>
          <td>${r.Narrative || ''}</td>
          <td>${r.Rationale || ''}</td>
        `;
        tbody.appendChild(tr);
      }
      table.style.display = hasRows ? 'table' : 'none';
      if (!hasRows) {
        title.textContent += ' (no narratives/rationales recorded in the top list)';
      }
    }

    renderTable();
  </script>
