icted to be involved in translational initiation. Predicted to be located in cytoskeleton.", "MANUAL_DESCRIPTION_WB": "", "effect": "frameshift_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "", "filtered_pubmed": "", "agent1_publication_comments": "", "runs": [{"run_index": 1, "rank": 2, "Narrative": "The IV:693430 C>CA frameshift variant (frameshift_variant; impact=HIGH) is predicted to truncate Y55F3C.17 and likely abolish microtubule-binding or translation-initiation functions that could impair neurite outgrowth or neuronal integrity, though the low QUAL reduces confidence [Effect=frameshift_variant; impact=HIGH; QUAL=5.0; DP=NaN; WB_Overview=\"Predicted microtubule binding activity; predicted to be involved in translational initiation\"]", "Rationale": "A frameshift predicted to truncate a protein with microtubule-binding/translation-initiation roles could impair neurite outgrowth or neuronal integrity."}]}, {"gene": "cla-1", "average_rank": 3.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODERATE", "WB_Overview": "Predicted to enable SNARE binding activity; calcium ion sensor activity; and calcium-dependent phospholipid binding activity. Involved in maintenance of presynaptic active zone structure; spontaneous synaptic transmission; and synaptic vesicle cycle. Located in presynaptic active zone. Expressed in nervous system.", "MANUAL_DESCRIPTION_WB": "F45E4.3 encodes a protein containing C-terminal PDZ and C2 Ca2+-binding domains that is related to the mammalian active zone protein Piccolo/Aczonin; loss of F45E4.3 activity has been reported to result in uncoordinated locomotion, suggesting that F45E4.3 plays a role in the organization and/or function of the neuromuscular system.", "effect": "missense_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 29160205: Clarinet (CLA-1), a novel active zone protein required for synaptic vesicle clustering and release. (https://pubmed.ncbi.nlm.nih.gov/29160205/ ted muscle cells. (https://pubmed.ncbi.nlm.nih.gov/22102824/) ; PMID 25562820: Rb and FZR1/Cdh1 determine CDK4/6-cyclin D requirement in C. elegans and human cancer cells. (https://pubmed.ncbi.nlm.nih.gov/25562820/)", "filtered_pubmed": "40383750; 22102824; 25562820", "agent1_publication_comments": "PMID40383750: Relevant - score:10 Reason:The study directly links CDK-4 activity to aging-related physiological and metabolic changes in C. elegans and identifies canonical effectors LIN-35 (Rb) and EFL-1 (E2F) as the mediators, demonstrating a mechanistic pathway independent of mTORC1. These findings provide clear mechanistic relevance for CDK-4 in regulating nucleolar size, protein synthesis, ATP production, and fat accumulation associated with accelerated aging phenotypes. ; PMID22102824: Relevant - score:10 Reason:The paper demonstrates that C. elegans Cyclin D/CDK-4 (CYD-1/CDK-4) expression is sufficient to induce DNA synthesis and activate a broad program of cell cycle genes in post‑mitotic muscle cells, providing direct mechanistic evidence linking CDK-4 to G1/S re‑entry. It also shows CYD-1/CDK-4 uniquely upregulates growth/metabolic genes and downregulates catabolic genes, indicating a distinct metabolic regulatory role of CDK-4 relevant to the phenotype. ; PMID25562820: Relevant - score:10 Reason:The paper provides direct biochemical and genetic evidence that CDK-4/CYD-1 phosphorylates the Rb orthologue LIN-35 and the APC/C co-activator FZR-1, and that simultaneous loss of these substrates eliminates the requirement for CDK-4. In human cells, knockdown of Rb and FZR1 likewise bypasses CDK4/6 inhibitor-induced arrest, establishing a conserved mechanism relevant to cdk-4 function and inhibitor response.", "runs": [{"run_index": 1, "rank": 4, "Narrative": "A missense_variant in cdk-4 (impact=MODERATE) could impair cell-cycle progression of neuronal progenitors or post-mitotic cell growth programs, leading to failed differentiation or neuron loss, although such effects may be pleiotropic [Effect=missense_variant; impact=MODERATE; QUAL=43.9; DP=10.0; MANUAL_DESCRIPTION_WB=\"cdk-4 encodes a cyclin-dependent kinase essential for G1 progression\"; distilled_mechanism=\"CDK-4 controls nucleolar size and organismal metabolism via LIN-35 and EFL-1\"]", "Rationale": "A missense change in CDK-4, a cyclin-dependent kinase with neuronal expression and roles in cell growth, could perturb progenitor cell-cycle or post-mitotic growth programs affecting neuron differentiation or survival."}]}, {"gene": "ceh-36", "average_rank": 5.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODIFIER", "WB_Overview": "Enables RNA polymerase II transcription regulatory region sequence-specific DNA binding activity. Involved in neuron fate specification; positive regulation of transcription by RNA polymerase II; and sensory perception of chemical stimulus. Located in nucleus. Expressed in ABaraappa; ABaraappaa; amphid neurons; and head neurons. Is an ortholog of human ARGFX (arginine-fifty homeobox) and DPRX (divergent-paired related homeobox).", "MANUAL_DESCRIPTION_WB": "ceh-36 encodes a paired-like homeodomain transcription factor that is one of three orthodenticle (OTX/OTD) homeodomain proteins in C. elegans (the others being TTX-1 and CEH-37); CEH-36 is required broadly for specification of the AWC olfactory neuron and also for establishing the left-right asymmetry of the ASEL and ASER gustatory neurons; in addition, CEH-36 is sufficient to specify the AFD thermosensory neuron fate in some cell types; CEH-36 is expressed in the AWC and ASE chemosensory neurons.", "effect": "upstream_gene_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 25738873: The Bicoid class homeodomain factors ceh-36/OTX and unc-30/PITX cooperate in C. elegans embryonic progenitor cells to regulate robust development. (https://pubmed.ncbi.nlm.nih.gov/25738873/) ; PMID 26998749: C. elegans Demonstrates Distinct Behaviors within a Fixed and Uniform Electric Field. (https://pubmed.ncbi.nlm.nih.gov/26998749/) ; PMID 34849889: Synergistic roles of homeodomain proteins UNC-62 homothorax and MLS-2 HMX/NKX in the specification of olfactory neurons in Caenorhabditis elegans. (https://pubmed.ncbi.nlm.nih.gov/34849889/)", "filtered_pubmed": "25738873; 26998749; 34849889", "agent1_publication_comments": "PMID25738873: Relevant - score:10 Reason:ceh-36 is expressed in progenitors of over 30% of embryonic cells and ceh-36 mutants show quantitative cell cycle and cell migration defects, indicating a direct role in progenitor cell behaviors. Genetic redundancy with unc-30 and the requirement of these factors for robust mls-2/HMX expression link ceh-36 mechanistically to regulation of downstream developmental programs and embryo viability. ; PMID26998749: Relevant - score:10 Reason:The paper reports that ceh-36 mutants, which are defective in terminal differentiation of AWC and ASE sensory neurons, are partially defective in electrotaxis, directly linking ceh-36 function to the sensory circuit driving navigation in an electric field. This provides mechanistic relevance because altered neuronal differentiation/identity plausibly disrupts the sensory signaling required for electrotactic behavior. ; PMID34849889: Relevant - score:10 Reason:The paper directly implicates CEH-36 as the OTX/OTD transcription factor that specifies general AWC olfactory neuron identity (in concert with SOX-2) and describes upstream regulation of ceh-36 by MLS-2 and overlapping function with UNC-62, linking gene function to AWC identity and subtype specification. These findings establish clear mechanistic roles relevant to the requested phenotype of AWC specification and asymmetric AWCON/AWCOFF differentiation.", "runs": [{"run_index": 1, "rank": 5, "Narrative": "An upstream variant near ceh-36 (upstream_gene_variant; impact=MODIFIER) could alter CEH-36 expression; CEH-36 is a paired-like homeodomain TF required for specification of multiple sensory neurons, so altered expression could disrupt MCM neuron fate specification or maintenance [Effect=upstream_gene_variant; impact=MODIFIER; QUAL=43.8; DP=10.0; MANUAL_DESCRIPTION_WB=\"ceh-36 encodes a paired-like homeodomain TF required broadly for specification of the AWC olfactory neuron and ASEL/ASER; sufficient to specify AFD in some contexts\"; distilled_mechanism=\"ceh-36 acts in embryonic progenitor cells... specifies terminal differentiation of AWC and ASE sensory neurons\"]", "Rationale": "An upstream variant near CEH-36, an OTX-like homeodomain transcription factor required for sensory neuron specification, could alter expression and thereby disrupt neuron fate decisions relevant to dopaminergic lineage."}]}, {"gene": "efhc-1", "average_rank": 6.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODIFIER", "WB_Overview": "Predicted to enable alpha-tubulin binding activity. Predicted to be involved in cilium-dependent cell motility; mitotic cytokinesis; and mitotic spindle organization. Predicted to be located in axoneme and mitotic spindle. Expressed in ciliated neurons and ray. Human ortholog(s) of this gene implicated in juvenile absence epilepsy 1 and juvenile myoclonic epilepsy. Is an ortholog of human EFHC1 (EF-hand domain containing 1).", "MANUAL_DESCRIPTION_WB": "", "effect": "downstream_gene_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 30810526: EFHC1, implicated in juvenile myoclonic epilepsy, functions at the cilium and synapse to modulate dopamine signaling. (https://pubmed.ncbi.nlm.nih.gov/30810526/)", "filtered_pubmed": "30810526", "agent1_publication_comments": "PMID30810526: Relevant - score:10 Reason:The study demonstrates EFHC-1 localizes to neuronal non-motile cilia and synapses and directly regulates neuronal activation and dopamine signaling, processes central to neuronal excitability and epilepsy phenotypes. It further shows EFHC-1 cooperates with an R-type voltage-gated calcium channel ortholog ion and neurite remodeling, could affect expression or splicing and thereby neuronal development/maintenance."}]}, {"gene": "pks-1", "average_rank": 8.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODERATE", "WB_Overview": "Predicted to enable fatty acid synthase activity. Predicted to be involved in fatty acid biosynthetic process. Expressed in CANL and CANR.", "MANUAL_DESCRIPTION_WB": "", "effect": "missense_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 34389721: Mapping the biosynthetic pathway of a hybrid polyketide-nonribosomal peptide in a metazoan. (https://pubmed.ncbi.nlm.nih.gov/34389721/) ; PMID 38915494: Comparative analysis of new, mScarlet-based red fluorescent tags in Caenorhabditis elegans. (https://pubmed.ncbi.nlm.nih.gov/38915494/) ; PMID 39103170: Comparative analysis of new mScarlet-based red fluorescent tags in Caenorhabditis elegans. (https://pubmed.ncbi.nlm.nih.gov/39103170/)", "filtered_pubmed": "34389721", "agent1_publication_comments": "PMID34389721: Relevant - score:10 Reason:The study directly maps PKS-1 enzymatic domains and demonstrates PKS-1's role in nemamide biosynthesis in C. elegans, linking gene function to metabolite production. It also identifies a specific trafficking mechanism (adenylation and direct loading onto NRPS-1) that mechanistically explains intermediate transfer between PKS and NRPS systems. ; PMID38915494: Irrelevant - score:2 Reason:The paper reports technical comparisons of red fluorescent tags (mScarlet variants vs GFP) and notes earlier detection of mScarlet-I3 for reporter alleles including pks-1, but it does not describe molecular function, pathways, or mechanistic effects of pks-1. Therefore it lacks mechanistic information relevant to pks-1-driven phenotypes. ; PMID39103170: Irrelevant - score:2 Reason:The paper evaluates fluorescent reporter performance (maturation, brightness, signal-to-noise) and only reports that pks-1 reporter expression was compared, without probing pks-1 biochemical function, interactions, or causal pathways. Thus it provides useful methodological context for imaging pks-1 expression but no mechanistic insight into pks-1's role or mechanism.", "runs": [{"run_index": 1, "rank": 8, "Narrative": "A missense_variant in PKS-1 (impact=MODERATE) could alter synthesis of neuroactive polyketides or signaling molecules produced by neurons (PKS-1 is expressed in specific neurons), potentially affecting MCM neuron fate indirectly [Effect=missense_variant; impact=MODERATE; QUAL=29.5; DP=NaN; gene_knowledge.distilled_mechanism=\"PKS-1 synthesizes an advanced polyketide intermediate... for nemamide biosynthesis\"; WB_Overview=\"Predicted fatty acid synthase activity; expressed in CANL/CANR\"]", "Rationale": "A missense change in PKS-1, a neuronally expressed polyketide synthase, could alter synthesis of neuroactive small molecules that modulate neuronal fate or survival."}]}, {"gene": "col-183", "average_rank": 9.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODERATE", "WB_Overview": "Predicted to be a structural constituent of cuticle. Predicted to be located in membrane. Predicted to be part of collagen trimer. Expressed in hypodermis.", "MANUAL_DESCRIPTION_WB": "", "effect": "missense_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 34265532: Integrating transcriptomics and behavior tests reveals how the C. elegans responds to copper induced aging. (https://pubmed.ncbi.nlm.nih.gov/34265532/) ; PMID 31242447: Genetic markers enable the verification and manipulation of the dauer entry decision. (https://pubmed.ncbi.nlm.nih.gov/31242447/)", "filtered_pubmed": "34265532; 31242447", "agent1_publication_comments": "PMID34265532: Relevant - score:8 Reason:col-183 is explicitly listed among the top regulated cuticle collagen (col) genes in response to copper exposure, and the authors link altered col gene expression to disrupted cuticle collagen synthesis that coincides with aging p     function formatNumber(x) {
      if (x === null || x === undefined || isNaN(x)) return '';
      return x.toFixed(3);
    }

    function renderTable() {
      const tbody = document.querySelector('#genes-table tbody');
      tbody.innerHTML = '';
      // DATA.genes is already sorted by average_rank ascending in the Python script.
      const genes = DATA.genes || [];
      for (const g of genes) {
        const tr = document.createElement('tr');
        tr.dataset.gene = g.gene;
        tr.innerHTML = `
          <td>${g.gene}</td>
          <td>${formatNumber(g.average_rank)}</td>
          <td>${formatNumber(g.rank_variance)}</td>
          <td>${g.n_runs_seen}</td>
        `;
        tr.addEventListener('click', () => renderDetail(g));
        tbody.appendChild(tr);
      }
    }

    function renderDetail(geneEntry) {
      const title = document.getElementById('detail-title');
      const meta = document.getElementById('detail-meta');
      const table = document.getElementById('detail-table');
      const tbody = table.querySelector('tbody');
      title.textContent = `Details for gene: ${geneEntry.gene}`;
      const metaLines = [];
      if (geneEntry.effect) metaLines.push(`<strong>Effect</strong>: ${geneEntry.effect}`);
      if (geneEntry.impact_bucket) metaLines.push(`<strong>impact_bucket</strong>: ${geneEntry.impact_bucket}`);
      if (geneEntry.user_annotation) metaLines.push(`<strong>user_annotation</strong>: ${geneEntry.user_annotation}`);
      if (geneEntry.WB_Overview) metaLines.push(`<strong>WB_Overview</strong>: ${geneEntry.WB_Overview}`);
      if (geneEntry.MANUAL_DESCRIPTION_WB) metaLines.push(`<strong>MANUAL_DESCRIPTION_WB</strong>: ${geneEntry.MANUAL_DESCRIPTION_WB}`);
      if (geneEntry.pubmed_ref_avaiable) metaLines.push(`<strong>pubmed_ref_avaiable</strong>: ${geneEntry.pubmed_ref_avaiable}`);
      if (geneEntry.filtered_pubmed) metaLines.push(`<strong>filtered_pubmed</strong>: ${geneEntry.filtered_pubmed}`);
      if (geneEntry.agent1_publication_comments) metaLines.push(`<strong>agent1_publication_comments</strong>: ${geneEntry.agent1_publication_comments}`);
      meta.innerHTML = metaLines.length ? metaLines.join('<br/>') : '';
      tbody.innerHTML = '';
      let hasRows = false;
      for (const r of geneEntry.runs) {
        const hasText = (r.Narrative && r.Narrative.trim()) || (r.Rationale && r.Rationale.trim());
        if (!hasText) continue;
        hasRows = true;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.run_index}${r.rank ? ` (rank ${r.rank})` : ''}</td>
          <td>${r.Narrative || ''}</td>
          <td>${r.Rationale || ''}</td>
        `;
        tbody.appendChild(tr);
      }
      table.style.display = hasRows ? 'table' : 'none';
      if (!hasRows) {
        title.textContent += ' (no narratives/rationales recorded in the top list)';
      }
    }

    renderTable();
  </script>
