    const DATA = {"timestamp": "2026_03_25_21_46", "num_runs": 1, "genes": [{"gene": "cdk-4", "average_rank": 1.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODERATE", "WB_Overview": "Enables protein serine/threonine kinase activity. Involved in several processes, including G1/S transition of mitotic cell cycle; developmental process involved in reproduction; and positive regulation of cell cycle process. Part of cyclin D1-CDK4 complex. Expressed in gonad; intestine; neurons; and vulva. Used to study cancer. Human ortholog(s) of this gene implicated in several diseases, including carcinoma (multiple); central nervous system cancer (multiple); and urinary system cancer (multiple). Is an ortholog of human CDK4 (cyclin dependent kinase 4) and CDK6 (cyclin dependent kinase 6).", "MANUAL_DESCRIPTION_WB": "cdk-4 encodes two isoforms of a cyclin-dependent serine/threonine protein kinase orthologous to human CDK4 and CDK6 (OMIM:123829 and OMIM:603368, mutated in cutanous malignant melanoma) which complex with D-type cyclins to regulate progression through the G1 phase of the cell cycle; CDK-4 activity is essential for G1 progression in postembryonic blast cells and as a result, cdk-4 mutant animals generally arrest during larval stages; the lethality generated by cdk mutations, also seen in animals doubly mutant for cdk-4 and cyd-1, a C. elegans D-type cyclin, can be suppressed by mutations in lin-35/Rb suggesting that, as in other organisms, LIN-35/Rb may be a major target of CDK-4/CYD-1 kinase activity; CDK-4 expression is first detected in neuronal and hypodermal lineages during mid-to-late embryogenesis, with postembryonic expression detected in hypodermal seam cells, cells of the P lineage which will give rise to ventral cord neurons, and cells of the somatic gonad, the vulva, and the intestine.", "effect": "missense_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 40383750: CDK-4 regulates nucleolar size and metabolism at the cost of late-life fitness in C. elegans. (https://pubmed.ncbi.nlm.nih.gov/40383750/) ; PMID 22102824: Caenorhabditis elegans cyclin D/CDK4 and cyclin E/CDK2 induce distinct cell cycle re-entry programs in differentiated muscle cells. (https://pubmed.ncbi.nlm.nih.gov/22102824/) ; PMID 25562820: Rb and FZR1/Cdh1 determine CDK4/6-cyclin D requirement in C. elegans and human cancer cells. (https://pubmed.ncbi.nlm.nih.gov/25562820/)", "filtered_pubmed": "22102824; 25562820", "agent1_publication_comments": "PMID40383750: Irrelevant - score:2 Reason:The paper links CDK-4 to organismal aging and metabolic changes via LIN-35 (Rb) and EFL-1 (E2F) but presents no data on regulation of asymmetric cell divisions, spindle orientation, lineage-specific proliferation, or AMso/MCM development. While CDK-4 is a cell-cycle kinase, the summary describes systemic metabolic/aging effects rather than a mechanistic connection to AMso division failure that would explain loss of MCM neurons. ; PMID22102824: Relevant - score:8 Reason:The paper demonstrates that CYD-1/CDK-4 specifically activates G1/S transcriptional programs and can induce DNA synthesis in post‑mitotic C. elegans cells, showing direct control over cell‑cycle entry rather than generic housekeeping activity. This provides a plausible mechanistic link to AMso division failure (which could result from failed G1/S entry), although the study does not examine asymmetric mitosis or AMso-specific polarity/fate determinants. ; PMID25562820: Relevant - score:8 Reason:The study demonstrates that CDK-4/CYD-1 is essential for cell-cycle entry in C. elegans by phosphorylating and inhibiting LIN-35 (Rb) and FZR-1 (Cdh1), directly implicating CDK-4 in driving mitotic entry. This provides a plausible mechanistic route whereby loss or inhibition of cdk-4 would prevent the AMso precursor from entering mitosis, causing the observed division failure and downstream loss of MCM neurons.", "runs": [{"run_index": 1, "rank": 1, "Narrative": "A missense variant in cdk-4 is highly plausible to cause AMso division failure because CDK-4 (with CYD-1) drives G1/S transcriptional programs and DNA synthesis necessary for post‑embryonic cell-cycle entry; loss or weakening of CDK-4 activity would block AMso mitotic entry and prevent production of MCM neurons [Effect=missense_variant; impact_bucket=MODERATE; QUAL=43.9; DP=10.0; MANUAL_DESCRIPTION_WB=\"cdk-4...complex with D-type cyclins to regulate G1 phase\"; distilled_mechanism=\"CYD-1/CDK-4 activates a G1/S transcriptional program and induces DNA synthesis... loss of CDK-4 activity would block AMso mitotic entry and cause division failure leading to MCM neuron loss.\"]", "Rationale": "A missense in CDK-4 is the most compelling candidate because CDK-4/CYD-1 activity is directly required for G1/S entry of post‑embryonic blast cells and loss would block AMso mitotic entry and MCM production."}]}, {"gene": "klp-19", "average_rank": 2.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODIFIER", "WB_Overview": "Predicted to enable ATP hydrolysis activity; microtubule binding activity; and microtubule motor activity. Involved in meiotic chromosome condensation and meiotic spindle midzone assembly. Located in condensed nuclear chromosome; nucleoplasm; and spindle. Expressed in germ line. Human ortholog(s) of this gene implicated in non-syndromic X-linked intellectual disability 100. Is an ortholog of human KIF4A (kinesin family member 4A) and KIF4B (kinesin family member 4B).", "MANUAL_DESCRIPTION_WB": "klp-19 encodes a plus-end-directed microtubule motor protein that is most closely related to motors of the kinesin-4 family; KLP-19 activity is essential for embryonic and larval development and is required for generating a force that aligns sister chromatid kinetochores  directly opposite the spindle poles thus ensuring proper holocentric chromosome segregation; KLP-19 expression is detected in embryos and in the gonad, where it is most strongly expressed in distal mitotic nuclei and in late meiotic prophase nucleoplasm; during meiosis and mitosis, KLP-19 expression is dynamic and is detected in the nucleoplasm, the spindle body, in association with condensed chromosomes (particularly between homologous chromosomes), and in the spindle interzone.", "effect": "5_prime_UTR_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 37961478: Chromokinesin Klp-19 regulates microtubule overlap and dynamics during anaphase in C. elegans. (https://pubmed.ncbi.nlm.nih.gov/37961478/) ; PMID 15452142: Loss of KLP-19 polar ejection force causes misorientation and missegregation of holocentric chromosomes. (https://pubmed.ncbi.nlm.nih.gov/15452142/) ; PMID 27939944: A SUMO-Dependent Protein Network Regulates Chromosome Congression during Oocyte Meiosis. (https://pubmed.ncbi.nlm.nih.gov/27939944/)", "filtered_pubmed": "37961478; 15452142; 27939944", "agent1_publication_comments": "PMID37961478: Relevant - score:6 Reason:KLP-19 is a chromokinesin that controls antiparallel microtubule overlap and local microtubule dynamics in the spindle midzone, and its depletion alters spindle dynamics and force transmission that can compromise mitotic progression. The study does not address asymmetric spindle positioning or AMso-specific divisions, so while KLP-19 perturbation could plausibly cause division failure of AMso, direct evidence linking it to MCM loss is lacking. ; PMID15452142: Relevant - score:8 Reason:KLP-19 is a mitotic microtubule motor that generates polar ejection forces to maintain kinetochore orientation and prevent merotelic attachments; its depletion causes misalignment and anaphase bridges in all mitotic divisions, a mechanistic route to division failure. These mitotic segregation errors could plausibly cause asymmetric AMso division failure and consequent loss of MCM neurons in males. ; PMID27939944: Relevant - score:6 Reason:The study demonstrates that KLP-19 is a chromokinesin whose GEI-17-dependent sumoylation and incorporation into a SUMO-SIM ring complex are required for chromosome congression, a direct mechanism that can cause division fidelity failures if perturbed; however, the work is limited to oocyte meiosis and does not directly test mitotic asymmetric divisions of AMso lineage cells.", "runs": [{"run_index": 1, "rank": 2, "Narrative": "A 5' UTR variant in klp-19 is plausible because KLP-19 controls spindle forces and antiparallel microtubule overlap; its loss can disrupt mitosis/cytokinesis and produce division failure that would prevent AMso from completing the asymmetric division that generates MCM neurons [Effect=5_prime_UTR_variant; impact_bucket=MODIFIER; QUAL=25.5; gene_knowledge.distilled_mechanism=\"KLP-19...regulates antiparallel microtubule overlap... depletion can disrupt mitosis and cytokinesis.\"]", "Rationale": "A 5' UTR variant in KLP-19 is a strong candidate because KLP-19 controls spindle forces and accurate chromosome segregation and its disruption can produce mitotic/cytokinetic failure preventing the AMso asymmetric division."}]}, {"gene": "cyp-13B1", "average_rank": 3.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "HIGH", "WB_Overview": "Predicted to enable heme binding activity; iron ion binding activity; and oxidoreductase activity. Human ortholog(s) of this gene implicated in several diseases, including Ghosal hematodiaphyseal syndrome; familial Mediterranean fever; and leukemia (multiple). Is an ortholog of several human genes including CYP3A4 (cytochrome P450 family 3 subfamily A member 4); CYP3A5 (cytochrome P450 family 3 subfamily A member 5); and CYP3A7 (cytochrome P450 family 3 subfamily A member 7).", "MANUAL_DESCRIPTION_WB": "cyp-13B1 encodes one of ~80 C. elegans cytochrome P450s: membrane-associated, heme-containing NADPH-dependent monooxygenases that catalyze the oxidative metabolism of a variety of exogenous compounds and endogenous substrates.", "effect": "stop_gained", "user_annotation": "no annotation", "pubmed_ref_avaiable": "", "filtered_pubmed": "", "agent1_publication_comments": "", "runs": [{"run_index": 1, "rank": 3, "Narrative": "Repeat note: The stop_gained in cyp-13B1 (HIGH impact) could cause systemic developmental or metabolic perturbations that indirectly prevent AMso division, but as a P450 the mechanistic link to a lineage-specific asymmetric division is less direct [Effect=stop_gained; impact_bucket=HIGH; QUAL=50.4; MANUAL_DESCRIPTION_WB=\"cyp-13B1 encodes one of ~80 cytochrome P450s\"]", "Rationale": "A stop_gained in a cytochrome P450 is high-impact and could indirectly perturb development or signaling required for AMso division, making it a prioritized but mechanistically less direct candidate."}]}, {"gene": "plst-1", "average_rank": 4.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODIFIER", "WB_Overview": "Predicted to enable actin filament binding activity. Predicted to be involved in actin filament bundle assembly. Expressed in hypodermis; intestine; and pharynx. Human ortholog(s) of this gene implicated in autosomal dominant nonsyndromic deafness 76; congenital diaphragmatic hernia; and nicotine dependence. Is an ortholog of human PLS1 (plastin 1) and PLS3 (plastin 3).", "MANUAL_DESCRIPTION_WB": "plst-1 is an ortholog of human PLS1 (plastin 1), PLS3 (plastin 3) and LCP1 (lymphocyte cytosolic protein 1 (L-plastin)); plst-1 is involved in embryo development; This gene appears to be missing the N-terminus compared to all orthologous genes, suggesting that the N2 reference is missing this sequence due to an assembly issue.", "effect": "upstream_gene_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 36219157: β-heavy-spectrin stabilizes the constricting contractile ring during cytokinesis. (https://pubmed.ncbi.nlm.nih.gov/36219157/) ; PMID 28400443: Plastin increases cortical connectivity to facilitate robust polarization and timely cytokinesis. (https://pubmed.ncbi.nlm.nih.gov/28400443/)", "filtered_pubmed": "36219157; 28400443", "agent1_publication_comments": "PMID36219157: Relevant - score:10 Reason:The study demonstrates that β-heavy-spectrin/SMA-1 is essential to stabilize the actomyosin contractile ring and that SMA-1 loss causes repeated ring ruptures and cytokinesis failure; this provides a direct mechanistic route by which an AMso cell could fail cytokinesis during its asymmetric division and thus fail to produce the MCM daughter. The work connects molecular players (SMA-1, PLST-1) to physical failure of ring constriction, a proximal cause of division failure rather than a nonspecific housekeeping effect. ; PMID28400443: Relevant - score:10 Reason:PLST-1 is an actin-bundling protein required for F-actin network connectivity, NMY-2 coalescence, polarized cortical contractility, and successful cytokinesis in C. elegans embryos; loss of these activities directly explains how a cell could fail to polarize and complete division. Therefore PLST-1 deficiency provides a biologically plausible, mechanistic route to AMso asymmetric division failure and consequent loss of MCM neurons.", "runs": [{"run_index": 1, "rank": 4, "Narrative": "An upstream variant in plst-1 is mechanistically compelling because PLST-1 (plastin) bundles F-actin and promotes cortical connectivity required for polarized contractility and successful cytokinesis, so loss of PLST-1 activity would disrupt NMY-2 coalescence and polarized contractility, causing division failure of the AMso and loss of MCM neurons [Effect=upstream_gene_variant; impact_bucket=MODIFIER; QUAL=8.6; gene_knowledge.distilled_mechanism=\"Loss of PLST-1 reduces F-actin bundling and cortical connectivity... causing failed polarization and cytokinesis.\"]", "Rationale": "An upstream variant in PLST-1 (plastin) is plausible because PLST-1 bundles F-actin and promotes cortical connectivity required for polarized contractility and cytokinesis, so loss could block the AMso asymmetric division."}]}, {"gene": "vps-28", "average_rank": 5.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODIFIER", "WB_Overview": "Involved in receptor catabolic process. Part of ESCRT I complex. Is an ortholog of human VPS28 (VPS28 subunit of ESCRT-I).", "MANUAL_DESCRIPTION_WB": "vps-28 encodes the C. elegans ortholog of S. cerevisiae vacuolar protein sorting protein Vps28p and human VPS28; VPS-28 is a component of the C. elegans ESCRT-1 (Endosomal Sorting Complex Required for Transport, other members include VPS-37, MVB-12, and TSG-101) that is required for cell surface receptor degradation via the multivesicular body sorting pathway and hence, downregulation of receptor activity.", "effect": "upstream_gene_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 21688204: Differential physiological roles of ESCRT complexes in Caenorhabditis elegans. (https://pubmed.ncbi.nlm.nih.gov/21688204/) ; PMID 22558469: RAB-7 antagonizes LET-23 EGFR signaling during vulva development in Caenorhabditis elegans. (https://pubmed.ncbi.nlm.nih.gov/22558469/)", "filtered_pubmed": "21688204; 22558469", "agent1_publication_comments": "PMID21688204: Relevant - score:7 Reason:The paper shows vps-28 is an ESCRT-I component and ESCRT complexes are required for cytokinesis and endosomal trafficking; defects in ESCRT function can therefore plausibly cause cell division/abscission failures. Although the study does not examine AMso lineage or asymmetric neurogenesis directly, the described role of ESCRT in cytokinesis provides a biologically plausible mechanism for AMso asymmetric division failure leading to loss of MCM neurons. ; PMID22558469: Relevant - score:6 Reason:The paper demonstrates that vps-28 (ESCRT-I) promotes LET-23/EGFR trafficking through MVBs to the lysosome, antagonizing EGFR signaling—this trafficking-dependent regulation can directly influence cell-fate decisions that rely on asymmetric divisions. However, the work is limited to vulval VPC induction in hermaphrodites and does not directly test AMso asymmetric division or MCM neuron specification, so the link is plausible but indirect.", "runs": [{"run_index": 1, "rank": 5, "Narrative": "", "Rationale": "A variant affecting VPS-28 (ESCRT-I) is a strong functional candidate because ESCRT function is required for endosomal sorting and abscission during cytokinesis, processes that can be essential for completion of asymmetric divisions."}]}, {"gene": "ceh-36", "average_rank": 6.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODIFIER", "WB_Overview": "Enables RNA polymerase II transcription regulatory region sequence-specific DNA binding activity. Involved in neuron fate specification; positive regulation of transcription by RNA polymerase II; and sensory perception of chemical stimulus. Located in nucleus. Expressed in ABaraappa; ABaraappaa; amphid neurons; and head neurons. Is an ortholog of human ARGFX (arginine-fifty homeobox) and DPRX (divergent-paired related homeobox).", "MANUAL_DESCRIPTION_WB": "ceh-36 encodes a paired-like homeodomain transcription factor that is one of three orthodenticle (OTX/OTD) homeodomain proteins in C. elegans (the others being TTX-1 and CEH-37); CEH-36 is required broadly for specification of the AWC olfactory neuron and also for establishing the left-right asymmetry of the ASEL and ASER gustatory neurons; in addition, CEH-36 is sufficient to specify the AFD thermosensory neuron fate in some cell types; CEH-36 is expressed in the AWC and ASE chemosensory neurons.", "effect": "upstream_gene_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 25738873: The Bicoid class homeodomain factors ceh-36/OTX and unc-30/PITX cooperate in C. elegans embryonic progenitor cells to regulate robust development. (https://pubmed.ncbi.nlm.nih.gov/25738873/) ; PMID 26998749: C. elegans Demonstrates Distinct Behaviors within a Fixed and Uniform Electric Field. (https://pubmed.ncbi.nlm.nih.gov/26998749/) ; PMID 34849889: Synergistic roles of homeodomain proteins UNC-62 homothorax and MLS-2 HMX/NKX in the specification of olfactory neurons in Caenorhabditis elegans. (https://pubmed.ncbi.nlm.nih.gov/34849889/)", "filtered_pubmed": "25738873", "agent1_publication_comments": "PMID25738873: Relevant - score:6 Reason:ceh-36 is a homeodomain transcription factor required in embryonic progenitors and ceh-36 mutants show cell-cycle and division/migration defects in many cells, indicating a plausible mechanistic capacity to cause division failures. However, the evidence is embryonic and not explicitly tied to the male AMso lineage or to post-embryonic asymmetric AMso divisions that produce MCM neurons. ; PMID26998749: Irrelevant - score:2 Reason:The paper links ceh-36 to terminal differentiation of amphid sensory neurons (AWC, ASE) and discusses regulators of AWC functional asymmetry (nsy-1, nsy-5/inx-19), but it does not address the AMso lineage, asymmetric cell division machinery, or mechanisms that would cause AMso division failure producing loss of MCM neurons. Mentions of neuronal 'asymmetry' refer to functional identity of AWC neurons rather than asymmetric mitotic division relevant to MCM generation. ; PMID34849889: Irrelevant - score:2 Reason:The paper shows CEH-36 functions in specifying AWC sensory neuron identity and in postmitotic asymmetric subtype differentiation regulated by MLS-2 and UNC-62, but it presents no evidence linking these factors to asymmetric cell division or to the AMso lineage that generates MCM neurons. Therefore it does not provide a mechanistic explanation for AMso division failure leading to MCM loss.", "runs": [{"run_index": 1, "rank": 6, "Narrative": "An upstream variant mapping strongly to ceh-36 is a high-priority candidate because CEH-36 is a homeodomain transcription factor whose loss perturbs progenitor transcriptional programs and can produce cell-cycle and asymmetric division defects preventing normal AMso divisions and MCM neuron generation [Effect=upstream_gene_variant; impact_bucket=MODIFIER; QUAL=43.8; DP=10.0; Parental_ratio=1.0; ems_label=EMS; MANUAL_DESCRIPTION_WB=\"ceh-36...required broadly for specification of the AWC olfactory neuron...\"; distilled_mechanism=\"Loss of ceh-36 perturbs transcriptional programs... producing cell-cycle and division/migration defects that can cause failure of progenitor asymmetric divisions.\"]", "Rationale": "An upstream variant near CEH-36 is a priority because CEH-36 is a homeodomain transcription factor that, when lost, perturbs progenitor transcriptional programs and can produce asymmetric division and cell‑cycle defects relevant to AMso fate."}]}, {"gene": "dsl-3", "average_rank": 7.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODIFIER", "WB_Overview": "Predicted to enable Notch binding activity. Predicted to be involved in cell fate specification. Predicted to be located in plasma membrane.", "MANUAL_DESCRIPTION_WB": "dsl-3 encodes a putative secreted protein with single DSL and EGF domainsin series, somewhat like Delta/LAG-2; DSL-3 belongs to a nematode-specificfamily of Delta/LAG-2-like proteins that includes DSL-1, -2, -3, -5, -6,and -7.", "effect": "upstream_gene_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 23124064: Essential role for Notch signaling in restricting developmental plasticity. (https://pubmed.ncbi.nlm.nih.gov/23124064/)", "filtered_pubmed": "23124064", "agent1_publication_comments": "PMID23124064: Relevant - score:7 Reason:The paper shows DSL-3–dependent Notch signaling enforces a lineage-autonomous switch from plasticity to commitment and thereby stabilizes daughter-cell fates after division, a mechanism capable of impacting asymmetric fate outcomes; however the work is in the embryonic AB lineage rather than the male AMso/MCM lineage, so direct evidence for causing AMso asymmetric division failure is indirect.", "runs": [{"run_index": 1, "rank": 7, "Narrative": "An upstream variant in dsl-3 is functionally plausible because DSL-3 is a secreted DSL/Delta-like ligand that can activate Notch signaling to enforce post-division commitment of daughter cell fates; loss could allow reprogramming or failure to stabilize MCM fate following division [Effect=upstream_gene_variant; impact_bucket=MODIFIER; QUAL=6.8; MANUAL_DESCRIPTION_WB=\"dsl-3 encodes a putative secreted protein with DSL and EGF domains\"; gene_knowledge.distilled_mechanism=\"Secreted DSL-3 activates GLP-1/LIN-12 Notch signaling to set a lineage-autonomous memory...\"]", "Rationale": "An upstream variant in DSL-3 is functionally plausible because DSL-3 is a DSL/Delta-like ligand that can activate Notch to enforce post-division commitment of daughter fates and loss could prevent stabilization of MCM fate."}]}, {"gene": "nfki-1", "average_rank": 8.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODERATE", "WB_Overview": "Predicted to be involved in positive regulation of cell differentiation and regulation of transcription by RNA polymerase II. Expressed in several structures, including nervous system. Is an ortholog of human NFKBID (NFKB inhibitor delta).", "MANUAL_DESCRIPTION_WB": "", "effect": "missense_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 32999373: Ancestral function of Inhibitors-of-kappaB regulates Caenorhabditis elegans development. (https://pubmed.ncbi.nlm.nih.gov/32999373/) ; PMID 28099418: IL-17 is a neuromodulator of Caenorhabditis elegans sensory responses. (https://pubmed.ncbi.nlm.nih.gov/28099418/)", "filtered_pubmed": "32999373", "agent1_publication_comments": "PMID32999373: Relevant - score:7 Reason:The paper shows NFKI-1 is nuclear, binds histones and Polycomb proteins, and alters chromatin marks, phenocopying Polycomb/UTX mutants, indicating it can specifically modulate developmental gene expression rather than being a generic housekeeping factor. Although AMso asymmetric division is not directly examined, misregulation of Polycomb-controlled transcription programs is a biologically plausibl     function formatNumber(x) {
      if (x === null || x === undefined || isNaN(x)) return '';
      return x.toFixed(3);
    }

    function renderTable() {
      const tbody = document.querySelector('#genes-table tbody');
      tbody.innerHTML = '';
      // DATA.genes is already sorted by average_rank ascending in the Python script.
      const genes = DATA.genes || [];
      for (const g of genes) {
        const tr = document.createElement('tr');
        tr.dataset.gene = g.gene;
        tr.innerHTML = `
          <td>${g.gene}</td>
          <td>${formatNumber(g.average_rank)}</td>
          <td>${formatNumber(g.rank_variance)}</td>
          <td>${g.n_runs_seen}</td>
        `;
        tr.addEventListener('click', () => renderDetail(g));
        tbody.appendChild(tr);
      }
    }

    function renderDetail(geneEntry) {
      const title = document.getElementById('detail-title');
      const meta = document.getElementById('detail-meta');
      const table = document.getElementById('detail-table');
      const tbody = table.querySelector('tbody');
      title.textContent = `Details for gene: ${geneEntry.gene}`;
      const metaLines = [];
      if (geneEntry.effect) metaLines.push(`<strong>Effect</strong>: ${geneEntry.effect}`);
      if (geneEntry.impact_bucket) metaLines.push(`<strong>impact_bucket</strong>: ${geneEntry.impact_bucket}`);
      if (geneEntry.user_annotation) metaLines.push(`<strong>user_annotation</strong>: ${geneEntry.user_annotation}`);
      if (geneEntry.WB_Overview) metaLines.push(`<strong>WB_Overview</strong>: ${geneEntry.WB_Overview}`);
      if (geneEntry.MANUAL_DESCRIPTION_WB) metaLines.push(`<strong>MANUAL_DESCRIPTION_WB</strong>: ${geneEntry.MANUAL_DESCRIPTION_WB}`);
      if (geneEntry.pubmed_ref_avaiable) metaLines.push(`<strong>pubmed_ref_avaiable</strong>: ${geneEntry.pubmed_ref_avaiable}`);
      if (geneEntry.filtered_pubmed) metaLines.push(`<strong>filtered_pubmed</strong>: ${geneEntry.filtered_pubmed}`);
      if (geneEntry.agent1_publication_comments) metaLines.push(`<strong>agent1_publication_comments</strong>: ${geneEntry.agent1_publication_comments}`);
      meta.innerHTML = metaLines.length ? metaLines.join('<br/>') : '';
      tbody.innerHTML = '';
      let hasRows = false;
      for (const r of geneEntry.runs) {
        const hasText = (r.Narrative && r.Narrative.trim()) || (r.Rationale && r.Rationale.trim());
        if (!hasText) continue;
        hasRows = true;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.run_index}${r.rank ? ` (rank ${r.rank})` : ''}</td>
          <td>${r.Narrative || ''}</td>
          <td>${r.Rationale || ''}</td>
        `;
        tbody.appendChild(tr);
      }
      table.style.display = hasRows ? 'table' : 'none';
      if (!hasRows) {
        title.textContent += ' (no narratives/rationales recorded in the top list)';
      }
    }

    renderTable();
  </script>
