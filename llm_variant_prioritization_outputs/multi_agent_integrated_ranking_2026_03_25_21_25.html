    const DATA = {"timestamp": "2026_03_25_21_25", "num_runs": 1, "genes": [{"gene": "ceh-36", "average_rank": 1.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODIFIER", "WB_Overview": "Enables RNA polymerase II transcription regulatory region sequence-specific DNA binding activity. Involved in neuron fate specification; positive regulation of transcription by RNA polymerase II; and sensory perception of chemical stimulus. Located in nucleus. Expressed in ABaraappa; ABaraappaa; amphid neurons; and head neurons. Is an ortholog of human ARGFX (arginine-fifty homeobox) and DPRX (divergent-paired related homeobox).", "MANUAL_DESCRIPTION_WB": "ceh-36 encodes a paired-like homeodomain transcription factor that is one of three orthodenticle (OTX/OTD) homeodomain proteins in C. elegans (the others being TTX-1 and CEH-37); CEH-36 is required broadly for specification of the AWC olfactory neuron and also for establishing the left-right asymmetry of the ASEL and ASER gustatory neurons; in addition, CEH-36 is sufficient to specify the AFD thermosensory neuron fate in some cell types; CEH-36 is expressed in the AWC and ASE chemosensory neurons.", "effect": "upstream_gene_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 25738873: The Bicoid class homeodomain factors ceh-36/OTX and unc-30/PITX cooperate in C. elegans embryonic progenitor cells to regulate robust development. (https://pubmed.ncbi.nlm.nih.gov/25738873/) ; PMID 26998749: C. elegans Demonstrates Distinct Behaviors within a Fixed and Uniform Electric Field. (https://pubmed.ncbi.nlm.nih.gov/26998749/) ; PMID 34849889: Synergistic roles of homeodomain proteins UNC-62 homothorax and MLS-2 HMX/NKX in the specification of olfactory neurons in Caenorhabditis elegans. (https://pubmed.ncbi.nlm.nih.gov/34849889/)", "filtered_pubmed": "25738873; 26998749; 34849889", "agent1_publication_comments": "PMID25738873: Relevant - score:10 Reason:The study demonstrates ceh-36 is expressed in many embryonic progenitors and its loss produces cell cycle and migration defects, indicating a direct role in progenitor-state regulation. Its partial redundancy with unc-30 and requirement for robust mls-2/HMX expression mechanistically link ceh-36 to developmental robustness and lethality when both factors are lost. ; PMID26998749: Relevant - score:10 Reason:The study directly shows ceh-36 mutants, which are defective in terminal differentiation of AWC and ASE sensory neurons, are partially impaired in electrotaxis, linking ceh-36 function to the sensory basis of the behavior. This provides mechanistic evidence that ceh-36-dependent neuronal differentiation and resultant AWC/ASE function/asymmetry underlie electric-field sensing and navigation. ; PMID34849889: Relevant - score:10 Reason:The paper directly implicates CEH-36 as the OTX/OTD transcription factor that specifies general AWC neuron identity and places ceh-36 downstream of MLS-2. It further shows UNC-62 acts redundantly with MLS-2 in a cell-autonomous manner to promote AWC identity and AWCON subtype differentiation.", "runs": [{"run_index": 1, "rank": 1, "Narrative": "An upstream variant near ceh-36, a paired-like OTX homeodomain TF required for specification of AWC and ASE sensory neurons, could disrupt ceh-36 expression in embryonic progenitors and thereby impair MCM neuron differentiation or maintenance; the variant maps perfectly (Parental_ratio=1.0) and originated from EMS which increases prior probability [Effect=upstream_gene_variant; impact_bucket=MODIFIER; QUAL=43.8; DP=10.0; Parental_ratio=1.0; EMS_label=True; MANUAL_DESCRIPTION_WB=\"CEH-36 is a paired-like homeodomain TF required broadly for AWC/ASE sensory neuron specification\"; distilled_mechanism=\"ceh-36 (OTX) functions in embryonic progenitor cells... promotes terminal differentiation of AWC and ASE sensory neurons, and loss disrupts AWC/ASE function and sensory asymmetry\"].", "Rationale": "CEH-36 is a homeodomain transcription factor required for sensory neuron specification and the variant maps perfectly (Parental_ratio=1.0) and arose from EMS, making it the top candidate despite being upstream."}]}, {"gene": "col-183", "average_rank": 2.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODERATE", "WB_Overview": "Predicted to be a structural constituent of cuticle. Predicted to be located in membrane. Predicted to be part of collagen trimer. Expressed in hypodermis.", "MANUAL_DESCRIPTION_WB": "", "effect": "missense_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 34265532: Integrating transcriptomics and behavior tests reveals how the C. elegans responds to copper induced aging. (https://pubmed.ncbi.nlm.nih.gov/34265532/) ; PMID 31242447: Genetic markers enable the verification and manipulation of the dauer entry decision. (https://pubmed.ncbi.nlm.nih.gov/31242447/)", "filtered_pubmed": "34265532; 31242447", "agent1_publication_comments": "PMID34265532: Relevant - score:8 Reason:The study identifies col-183 among the top differentially expressed col genes after copper exposure and links altered collagen gene expression to disrupted cuticle synthesis concurrent with aging phenotypes (shortened lifespan, reduced brood size, increased ROS). This provides transcriptomic and phenotypic correlation supporting mechanistic relevance, though direct functional perturbation of col-183 was not shown. ; PMID31242447: Relevant - score:10 Reason:The paper demonstrates that col-183 is a hypodermal marker whose dauer-specific expression corresponds to the commitment event of dauer entry and that its promoter can be used to drive daf-9 to alter developmental fate, directly linking col-183-marked hypodermal activity to the dauer decision. This provides mechanistic evidence that hypodermal cells marked by col-183 participate in regulating entry into dauer.", "runs": [{"run_index": 1, "rank": 2, "Narrative": "A missense in col-183 (impact MODERATE) with strong mapping (Parental_ratio=0.917) and EMS origin could alter hypodermal/cuticle structure which can non-autonomously influence neuronal patterning or reporter stability; col-183 has documented roles in hypodermal expression and cuticle/collagen biology [Effect=missense_variant; impact_bucket=MODERATE; QUAL=41.5; DP=8.0; Parental_ratio=0.917; EMS_label=EMS; WB_Overview=\"Predicted structural constituent of cuticle; expressed in hypodermis\"; distilled_mechanism=\"Copper exposure dysregulates col-183... col-183 is induced in hypodermal cells at the dauer commitment point and via its promoter can drive daf-9 expression...\"]", "Rationale": "A well-mapped (Parental_ratio=0.917), EMS-derived missense in col-183 with a defined hypodermal/cuticle role that can non-autonomously influence neuronal development makes this a plausible causal candidate."}]}, {"gene": "cyp-13B1", "average_rank": 3.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "HIGH", "WB_Overview": "Predicted to enable heme binding activity; iron ion binding activity; and oxidoreductase activity. Human ortholog(s) of this gene implicated in several diseases, including Ghosal hematodiaphyseal syndrome; familial Mediterranean fever; and leukemia (multiple). Is an ortholog of several human genes including CYP3A4 (cytochrome P450 family 3 subfamily A member 4); CYP3A5 (cytochrome P450 family 3 subfamily A member 5); and CYP3A7 (cytochrome P450 family 3 subfamily A member 7).", "MANUAL_DESCRIPTION_WB": "cyp-13B1 encodes one of ~80 C. elegans cytochrome P450s: membrane-associated, heme-containing NADPH-dependent monooxygenases that catalyze the oxidative metabolism of a variety of exogenous compounds and endogenous substrates.", "effect": "stop_gained", "user_annotation": "no annotation", "pubmed_ref_avaiable": "", "filtered_pubmed": "", "agent1_publication_comments": "", "runs": [{"run_index": 1, "rank": 3, "Narrative": "This stop_gained (HIGH-impact) in cyp-13B1 likely truncates the CYP enzyme, potentially altering metabolism of endogenous or exogenous signals important for neuronal development or reporter expression, though CYPs are not canonical fate determinants [Effect=stop_gained; impact_bucket=HIGH; QUAL=50.4; DP=16.0; Parental_ratio=NaN; EMS_label=EMS; MANUAL_DESCRIPTION_WB=\"cyp-13B1 encodes a cytochrome P450 involved in metabolism\"; WB_Overview=\"Predicted heme binding and oxidoreductase activity\"].", "Rationale": "A HIGH-impact stop_gained in cyp-13B1 (QUAL 50.4) is strongly disruptive, making it a top functional candidate even though cytochrome P450s are less often direct fate determinants."}]}, {"gene": "vwa-8", "average_rank": 4.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODIFIER", "WB_Overview": "Predicted to enable ATP binding activity and ATP hydrolysis activity. Predicted to be located in cytoplasm. Expressed in hypodermal cell; intestinal cell; and muscle cell. Is an ortholog of human VWA8 (von Willebrand factor A domain containing 8).", "MANUAL_DESCRIPTION_WB": "", "effect": "downstream_gene_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 32656508: C. elegans VWA-8 is a mitochondrial protein. (https://pubmed.ncbi.nlm.nih.gov/32656508/) ; PMID 32656509: A null mutation of C. elegans vwa-8. (https://pubmed.ncbi.nlm.nih.gov/32656509/)", "filtered_pubmed": "32656508", "agent1_publication_comments": "PMID32656508: Relevant - score:7 Reason:The title states VWA-8 localizes to mitochondria in C. elegans, directly connecting the gene to mitochondrial biology; this provides mechanistic plausibility for roles in mitochondrial function but does not specify the biochemical activity or pathway affected. ; PMID32656509: Irrelevant - score:1 Reason:Only the title ('A null mutation of C. elegans vwa-8') is provided with no abstract or experimental details, so there is insufficient mechanistic information to link vwa-8 to the requested phenotype or mechanisms.", "runs": [{"run_index": 1, "rank": 4, "Narrative": "A downstream variant with perfect mapping (Parental_ratio=1.0) in vwa-8, a mitochondrial protein, may alter mitochondrial function in cells that support neuronal development, potentially impairing MCM neuron survival or reporter expression indirectly [Effect=downstream_gene_variant; impact_bucket=MODIFIER; QUAL=30.3; DP=14.0; Parental_ratio=1.0; EMS_label=EMS; WB_Overview=\"Predicted ATP binding/hydrolysis activity; expressed in hypodermis, intestine, muscle\"; distilled_mechanism=\"VWA-8 localizes to mitochondria...\"].", "Rationale": "A strongly mapped (Parental_ratio=1.0), EMS-associated variant in a mitochondrial protein (VWA-8) that could affect neuronal maintenance/development indirectly and therefore is a plausible candidate."}]}, {"gene": "unc-2", "average_rank": 5.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODIFIER", "WB_Overview": "Predicted to enable voltage-gated calcium channel activity. Involved in several processes, including determination of left/right asymmetry in nervous system; negative regulation of transforming growth factor beta receptor signaling pathway; and response to stress. Located in presynaptic active zone membrane. Expressed in several structures, including body wall musculature; excretory canal; nerve ring; neurons; and pharyngeal muscle cell. Used to study migraine. Human ortholog(s) of this gene implicated in autoimmune disease of the nervous system (multiple); brain disease (multiple); and episodic ataxia type 2. Is an ortholog of human CACNA1B (calcium voltage-gated channel subunit alpha1 B) and CACNA1E (calcium voltage-gated channel subunit alpha1 E).", "MANUAL_DESCRIPTION_WB": "unc-2 encodes a calcium channel alpha subunit similar to the human P/Q-type calcium channel, CACNA1A; unc-2 is required for desensitization to dopamine, normal movement, normally low sensitivity of whole animals to serotonin, and neuronal migrations; unc-2 interacts with the TGF beta pathway to regulate movement, and maintain normal serotonin levels; unc-2/TGF beta pathway is also required for the stress-induced modulation of tryptophan hydroxylase/tph-1 expression in the serotonergic chemosensory ADF neurons (but not the NSM neurons); UNC-2 is expressed primarily in motor neurons, several sensory neurons, and the HSN and VC neurons controlling egg-laying.", "effect": "intron_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 40795403: Multiple autism genes influence GABA neuron remodeling via distinct developmental trajectories. (https://pubmed.ncbi.nlm.nih.gov/40795403/) ; PMID 33975919: UNC-2 CaV2 Channel Localization at Presynaptic Active Zones Depends on UNC-10/RIM and SYD-2/Liprin-α in Caenorhabditis elegans. (https://pubmed.ncbi.nlm.nih.gov/33975919/) ; PMID 40666880: Multiple autism genes influence GABA neuron remodeling via distinct developmental trajectories. (https://pubmed.ncbi.nlm.nih.gov/40666880/)", "filtered_pubmed": "40795403; 33975919; 40666880", "agent1_publication_comments": "PMID40795403: Relevant - score:10 Reason:The study directly implicates unc-2/CACNA1A in altering DVB GABAergic neuron morphology and behavior in C. elegans, linking the gene to experience-dependent neurite remodeling and circuit plasticity. This provides mechanistic evidence that unc-2 influences neurite outgrowth and presynaptic structure with consequent behavioral effects. ; PMID33975919: Relevant - score:10 Reason:The paper demonstrates directly that UNC-10/RIM and SYD-2/Liprin-α control presynaptic localization of UNC-2/CaV2 channels, with quantitative loss of UNC-2 puncta in unc-10 mutants and partial dependence on SYD-2. It further shows RIMB-1 and ELKS-1 contribute and that these active-zone scaffolds act redundantly to tether UNC-2. ; PMID40666880: Relevant - score:10 Reason:The study directly identifies unc-2/CACNA1A as one of the conserved autism-associated genes that significantly impacts DVB GABAergic neuron morphology and alters spicule-protraction behavior, linking unc-2 to experience-dependent neuron remodeling and circuit plasticity in C. elegans. This provides direct mechanistic relevance of unc-2 to the requested phenotype.", "runs": [{"run_index": 1, "rank": 5, "Narrative": "An intronic variant in unc-2 (CaV2 homolog) could alter splicing or regulation and UNC-2 is critical for neuronal migration and presynaptic architecture, so perturbation could disrupt MCM neuron formation or maintenance [Effect=intron_variant; impact_bucket=MODIFIER; QUAL=21.5; DP=NaN; Parental_ratio=NaN; EMS_label=non-EMS; MANUAL_DESCRIPTION_WB=\"unc-2 encodes calcium channel alpha subunit required for neuronal migrations\"; distilled_mechanism=\"unc-2 regulates remodeling of neurites and presynaptic architecture via CaV2 channels\"].", "Rationale": "UNC-2/CaV2 is a key neuronal calcium channel affecting migration, synaptic development and plasticity, so perturbation (even intronic) could disrupt MCM neuron fate or maintenance."}]}, {"gene": "cdk-4", "average_rank": 6.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODERATE", "WB_Overview": "Enables protein serine/threonine kinase activity. Involved in several processes, including G1/S transition of mitotic cell cycle; developmental process involved in reproduction; and positive regulation of cell cycle process. Part of cyclin D1-CDK4 complex. Expressed in gonad; intestine; neurons; and vulva. Used to study cancer. Human ortholog(s) of this gene implicated in several diseases, including carcinoma (multiple); central nervous system cancer (multiple); and urinary system cancer (multiple). Is an ortholog of human CDK4 (cyclin dependent kinase 4) and CDK6 (cyclin dependent kinase 6).", "MANUAL_DESCRIPTION_WB": "cdk-4 encodes two isoforms of a cyclin-dependent serine/threonine protein kinase orthologous to human CDK4 and CDK6 (OMIM:123829 and OMIM:603368, mutated in cutanous malignant melanoma) which complex with D-type cyclins to regulate progression through the G1 phase of the cell cycle; CDK-4 activity is essential for G1 progression in postembryonic blast cells and as a result, cdk-4 mutant animals generally arrest during larval stages; the lethality generated by cdk mutations, also seen in animals doubly mutant for cdk-4 and cyd-1, a C. elegans D-type cyclin, can be suppressed by mutations in lin-35/Rb suggesting that, as in other organisms, LIN-35/Rb may be a major target of CDK-4/CYD-1 kinase activity; CDK-4 expression is first detected in neuronal and hypodermal lineages during mid-to-late embryogenesis, with postembryonic expression detected in hypodermal seam cells, cells of the P lineage which will give rise to ventral cord neurons, and cells of the somatic gonad, the vulva, and the intestine.", "effect": "missense_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 40383750: CDK-4 regulates nucleolar size and metabolism at the cost of late-life fitness in C. elegans. (https://pubmed.ncbi.nlm.nih.gov/40383750/) ; PMID 22102824: Caenorhabditis elegans cyclin D/CDK4 and cyclin E/CDK2 induce distinct cell cycle re-entry programs in differentiated muscle cells. (https://pubmed.ncbi.nlm.nih.gov/22102824/) ; PMID 25562820: Rb and FZR1/Cdh1 determine CDK4/6-cyclin D requirement in C. elegans and human cancer cells. (https://pubmed.ncbi.nlm.nih.gov/25562820/)", "filtered_pubmed": "40383750; 22102824; 25562820", "agent1_publication_comments": "PMID40383750: Relevant - score:10 Reason:The paper directly demonstrates that CDK-4 activity controls nucleolar size and systemic metabolism in C. elegans and links these changes to aging phenotypes, using conditional depletion experiments. It further identifies canonical downstream effectors LIN-35 (Rb) and EFL-1 (E2F) and shows these metabolic effects occur independently of mTORC1, supporting a clear mechanistic pathway. ; PMID22102824: Relevant - score:10 Reason:The study directly demonstrates that CYD-1/CDK-4 (CDK-4) expression drives DNA synthesis in terminally differentiated C. elegans muscle and differentially regulates cell-cycle and metabolic gene programs, establishing a clear mechanistic link between CDK-4 activity and cell-cycle re-entry and metabolism. These findings provide explicit molecular and transcriptional evidence connecting CDK-4 function to the requested phenotype of cell-cycle re-entry in post-mitotic cells. ; PMID25562820: Relevant - score:10 Reason:The study demonstrates that CDK-4/CYD-1 directly phosphorylates the Rb orthologue LIN-35 and the APC/C co-activator FZR-1, and that simultaneous loss of lin-35 and fzr-1 eliminates the requirement for CDK-4 in C. elegans. Corresponding Rb and FZR1 knockdown in human cells synergistically bypasses growth arrest from a CDK4/6 inhibitor, directly linking these substrates to CDK4/6-dependent cell-cycle control and drug response.", "runs": [{"run_index": 1, "rank": 6, "Narrative": "A missense in cdk-4 (MODERATE impact) could disrupt G1/S progression of neuronal precursors and thus impair differentiation or survival of MCM neurons; CDK-4 is essential for postembryonic blast cell cycles and is expressed in neurons [Effect=missense_variant; impact_bucket=MODERATE; QUAL=43.9; DP=10.0; Parental_ratio=NaN; EMS_label=EMS; MANUAL_DESCRIPTION_WB=\"CDK-4 ortholog of CDK4/6, essential for G1 progression; expressed in neurons\"; distilled_mechanism=\"CDK-4 regulates nucleolar size and metabolism via LIN-35 and EFL-1...\"].", "Rationale": "CDK-4 is essential for G1 progression and postembryonic blast cell divisions, so a missense variant could non-specifically perturb neuronal lineage proliferation or differentiation."}]}, {"gene": "efhc-1", "average_rank": 7.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODIFIER", "WB_Overview": "Predicted to enable alpha-tubulin binding activity. Predicted to be involved in cilium-dependent cell motility; mitotic cytokinesis; and mitotic spindle organization. Predicted to be located in axoneme and mitotic spindle. Expressed in ciliated neurons and ray. Human ortholog(s) of this gene implicated in juvenile absence epilepsy 1 and juvenile myoclonic epilepsy. Is an ortholog of human EFHC1 (EF-hand domain containing 1).", "MANUAL_DESCRIPTION_WB": "", "effect": "downstream_gene_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 30810526: EFHC1, implicated in juvenile myoclonic epilepsy, functions at the cilium and synapse to modulate dopamine signaling. (https://pubmed.ncbi.nlm.nih.gov/30810526/)", "filtered_pubmed": "30810526", "agent1_publication_comments": "PMID30810526: Relevant - score:10 Reason:The paper demonstrates that EFHC-1 localizes to non-motile neuronal cilia and synapses and directly regulates neuronal activation by modulating dopamine signaling, linking subcellular localization to excitability control. It also shows cooperative interaction with an R-type voltage-gated calcium channel orthologue, providing a clear mechanistic route to altered neuronal thresholds relevant to epilepsy phenotypes.", "runs": [{"run_index": 1, "rank": 7, "Narrative": "A downstream variant in efhc-1 may alter regulatory elements influencing EFHC-1 levels; EFHC-1 localizes to sensory cilia and synapses and modulates dopamine signaling, making it relevant to neuron-specific reporter phenotypes [Effect=downstream_gene_variant; impact_bucket=MODIFIER; QUAL=3.8; DP=NaN; Parental_ratio=NaN; EMS_label=non-EMS; WB_Overview=\"Predicted alpha-tubulin binding; expressed in ciliated neurons\"; distilled_mechanism=\"EFHC-1 localizes to sensory cilia and synapses to regulate neuronal activation by modulating dopamine signaling\"].", "Rationale": "EFHC-1 localizes to sensory cilia and synapses and modulates dopamine signaling, making a downstream variant potentially relevant to dopaminergic/MCM neuron reporter loss."}]}, {"gene": "cla-1", "average_rank": 8.0, "rank_variance": 0.0, "n_runs_seen": 1, "impact_bucket": "MODERATE", "WB_Overview": "Predicted to enable SNARE binding activity; calcium ion sensor activity; and calcium-dependent phospholipid binding activity. Involved in maintenance of presynaptic active zone structure; spontaneous synaptic transmission; and synaptic vesicle cycle. Located in presynaptic active zone. Expressed in nervous system.", "MANUAL_DESCRIPTION_WB": "F45E4.3 encodes a protein containing C-terminal PDZ and C2 Ca2+-binding domains that is related to the mammalian active zone protein Piccolo/Aczonin; loss of F45E4.3 activity has been reported to result in uncoordinated locomotion, suggesting that F45E4.3 plays a role in the organization and/or function of the neuromuscular system.", "effect": "missense_variant", "user_annotation": "no annotation", "pubmed_ref_avaiable": "PMID 29160205: Clarinet (CLA-1), a novel active zone protein required for synaptic vesicle clustering and release. (https://pubmed.ncbi.nlm.nih.gov/29160205/) ; PMID 40631104: Inhibiting Clarinet/CLA-1 restores function to injured motor neurons. (https://pubmed.ncbi.nlm.nih.gov/40631104/)", "filtered_pubmed": "29160205; 40631104", "agent1_publication_comments": "PMID29160205: Relevant - score:10 Reason:The paper directly shows cla-1 encodes active-zone proteins that localize to presynaptic active zones and whose loss disrupts vesicle clustering, active zone structure, synapse number, and neurotransmitter release. These phenotypes (fewer undocked vesicles contacting the dense projection, more docked vesicles at the plasma membrane, reduced spontaneous release, increased depression) provide a clear mechanistic link to cla-1 function in vesicle tethering and release regulation. ; PMID40631104: Relevant - score:10 Reason:The study directly demonstrates that loss of CLA-1 (Clarinet) enhances axon regeneration and restores motor function, and it provides mechanistic evidence that this effect requires PTRN-1, a microtubule minus-end binding protein. This links CLA-1 to negative regulation of PTRN-1-mediated microtubule-based trafficking of injury-related cargo, explaining improved repair.", "runs": [{"run_index": 1, "ra     function formatNumber(x) {
      if (x === null || x === undefined || isNaN(x)) return '';
      return x.toFixed(3);
    }

    function renderTable() {
      const tbody = document.querySelector('#genes-table tbody');
      tbody.innerHTML = '';
      // DATA.genes is already sorted by average_rank ascending in the Python script.
      const genes = DATA.genes || [];
      for (const g of genes) {
        const tr = document.createElement('tr');
        tr.dataset.gene = g.gene;
        tr.innerHTML = `
          <td>${g.gene}</td>
          <td>${formatNumber(g.average_rank)}</td>
          <td>${formatNumber(g.rank_variance)}</td>
          <td>${g.n_runs_seen}</td>
        `;
        tr.addEventListener('click', () => renderDetail(g));
        tbody.appendChild(tr);
      }
    }

    function renderDetail(geneEntry) {
      const title = document.getElementById('detail-title');
      const meta = document.getElementById('detail-meta');
      const table = document.getElementById('detail-table');
      const tbody = table.querySelector('tbody');
      title.textContent = `Details for gene: ${geneEntry.gene}`;
      const metaLines = [];
      if (geneEntry.effect) metaLines.push(`<strong>Effect</strong>: ${geneEntry.effect}`);
      if (geneEntry.impact_bucket) metaLines.push(`<strong>impact_bucket</strong>: ${geneEntry.impact_bucket}`);
      if (geneEntry.user_annotation) metaLines.push(`<strong>user_annotation</strong>: ${geneEntry.user_annotation}`);
      if (geneEntry.WB_Overview) metaLines.push(`<strong>WB_Overview</strong>: ${geneEntry.WB_Overview}`);
      if (geneEntry.MANUAL_DESCRIPTION_WB) metaLines.push(`<strong>MANUAL_DESCRIPTION_WB</strong>: ${geneEntry.MANUAL_DESCRIPTION_WB}`);
      if (geneEntry.pubmed_ref_avaiable) metaLines.push(`<strong>pubmed_ref_avaiable</strong>: ${geneEntry.pubmed_ref_avaiable}`);
      if (geneEntry.filtered_pubmed) metaLines.push(`<strong>filtered_pubmed</strong>: ${geneEntry.filtered_pubmed}`);
      if (geneEntry.agent1_publication_comments) metaLines.push(`<strong>agent1_publication_comments</strong>: ${geneEntry.agent1_publication_comments}`);
      meta.innerHTML = metaLines.length ? metaLines.join('<br/>') : '';
      tbody.innerHTML = '';
      let hasRows = false;
      for (const r of geneEntry.runs) {
        const hasText = (r.Narrative && r.Narrative.trim()) || (r.Rationale && r.Rationale.trim());
        if (!hasText) continue;
        hasRows = true;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.run_index}${r.rank ? ` (rank ${r.rank})` : ''}</td>
          <td>${r.Narrative || ''}</td>
          <td>${r.Rationale || ''}</td>
        `;
        tbody.appendChild(tr);
      }
      table.style.display = hasRows ? 'table' : 'none';
      if (!hasRows) {
        title.textContent += ' (no narratives/rationales recorded in the top list)';
      }
    }

    renderTable();
  </script>
