age decisions, or neuron vs glia fate specification. Therefore it provides no mechanistic explanation for AMso dividing symmetrically to produce two glia and loss of MCM neurons. ; PMID32531261: Irrelevant - score:2 Reason:This study shows tdp-1 affects α‑synuclein aggregation, lysosomal gene expression, and heat-shock pathways to modulate dopaminergic neurodegeneration, but presents no data on asymmetric cell division, AMso lineage decisions, or glia-versus-neuron fate specification. Thus it does not provide a mechanistic explanation for AMso symmetric divisions producing two glia and loss of MCM neurons. ; PMID30770445: Irrelevant - score:2 Reason:The paper demonstrates TDP-43/TDP-1 functions in non-homologous end joining DSB repair and that TDP-1 loss causes DNA damage accumulation and neuronal vulnerability in C. elegans, which is a general genome-instability/neurodegeneration mechanism. It does not describe effects on asymmetric cell division, cytokinesis, spindle orientation, or other division-specific processes in AMso that would mechanistically explain conversion of an asymmetric AMso division into a symmetric glial division causing MCM loss.", "runs": [{"run_index": 1, "rank": 1, "Narrative": "A splice-acceptor HIGH-impact variant in tdp-1 (TDP-43 ortholog) could strongly change RNA processing in glia and neurons, potentially mis-splicing transcripts required for AMso asymmetric division or MCM fate determination [Effect=splice_acceptor_variant&intron_variant; impact_bucket=HIGH; QUAL=34.4; MANUAL_DESCRIPTION_WB=\"tdp-1 encodes the C. elegans ortholog of human TAR DNA/RNA binding protein TDP-43; involved in RNA processing and metabolism; expressed in neurons\"; WB_Overview=\"Enables chromatin binding and single-stranded RNA binding activity; involved in RNA splicing\"].", "Rationale": "A HIGH-impact splice-acceptor change in the TDP-43 ortholog is most likely to disrupt RNA processing in neurons/glia and thereby perturb transcripts necessary for AMso asymme     function formatNumber(x) {
      if (x === null || x === undefined || isNaN(x)) return '';
      return x.toFixed(3);
    }

    function renderTable() {
      const tbody = document.querySelector('#genes-table tbody');
      tbody.innerHTML = '';
      // DATA.genes is already sorted by average_rank ascending in the Python script.
      const genes = DATA.genes || [];
      for (const g of genes) {
        const tr = document.createElement('tr');
        tr.dataset.gene = g.gene;
        tr.innerHTML = `
          <td>${g.gene}</td>
          <td>${formatNumber(g.average_rank)}</td>
          <td>${formatNumber(g.rank_variance)}</td>
          <td>${g.n_runs_seen}</td>
        `;
        tr.addEventListener('click', () => renderDetail(g));
        tbody.appendChild(tr);
      }
    }

    function renderDetail(geneEntry) {
      const title = document.getElementById('detail-title');
      const meta = document.getElementById('detail-meta');
      const table = document.getElementById('detail-table');
      const tbody = table.querySelector('tbody');
      title.textContent = `Details for gene: ${geneEntry.gene}`;
      const metaLines = [];
      if (geneEntry.effect) metaLines.push(`<strong>Effect</strong>: ${geneEntry.effect}`);
      if (geneEntry.impact_bucket) metaLines.push(`<strong>impact_bucket</strong>: ${geneEntry.impact_bucket}`);
      if (geneEntry.user_annotation) metaLines.push(`<strong>user_annotation</strong>: ${geneEntry.user_annotation}`);
      if (geneEntry.WB_Overview) metaLines.push(`<strong>WB_Overview</strong>: ${geneEntry.WB_Overview}`);
      if (geneEntry.MANUAL_DESCRIPTION_WB) metaLines.push(`<strong>MANUAL_DESCRIPTION_WB</strong>: ${geneEntry.MANUAL_DESCRIPTION_WB}`);
      if (geneEntry.pubmed_ref_avaiable) metaLines.push(`<strong>pubmed_ref_avaiable</strong>: ${geneEntry.pubmed_ref_avaiable}`);
      if (geneEntry.filtered_pubmed) metaLines.push(`<strong>filtered_pubmed</strong>: ${geneEntry.filtered_pubmed}`);
      if (geneEntry.agent1_publication_comments) metaLines.push(`<strong>agent1_publication_comments</strong>: ${geneEntry.agent1_publication_comments}`);
      meta.innerHTML = metaLines.length ? metaLines.join('<br/>') : '';
      tbody.innerHTML = '';
      let hasRows = false;
      for (const r of geneEntry.runs) {
        const hasText = (r.Narrative && r.Narrative.trim()) || (r.Rationale && r.Rationale.trim());
        if (!hasText) continue;
        hasRows = true;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.run_index}${r.rank ? ` (rank ${r.rank})` : ''}</td>
          <td>${r.Narrative || ''}</td>
          <td>${r.Rationale || ''}</td>
        `;
        tbody.appendChild(tr);
      }
      table.style.display = hasRows ? 'table' : 'none';
      if (!hasRows) {
        title.textContent += ' (no narratives/rationales recorded in the top list)';
      }
    }

    renderTable();
  </script>
